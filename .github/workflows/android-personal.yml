name: Android personal server

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-personal-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: oauth-test-only
          MYSQL_DATABASE: oauth_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -poauth-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: oauth-test-only
          POSTGRES_DB: oauth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Sync standalone plugin packages
        run: bun scripts/sync-oauth-marketplace.mjs
      - name: Build embedded frontend
        working-directory: web
        run: bun install --frozen-lockfile && bunx tsc -b && bun run build
      - name: Verify OAuth and account pool
        env:
          PLUGIN_OAUTH_TEST_MYSQL_DSN: 'root:oauth-test-only@tcp(127.0.0.1:3306)/oauth_test?charset=utf8mb4&parseTime=True&loc=Local'
          PLUGIN_OAUTH_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=oauth-test-only dbname=oauth_test sslmode=disable'
        run: go test ./pkg/jsplugin ./service ./model ./controller ./router ./middleware ./relay/channel/task/jsplugin ./plugins
      - name: Verify standalone provider plugin fixtures
        run: |
          go build -o /tmp/aksara-plugin-check .
          for provider in codex claude antigravity; do
            source="plugins/personal-tasks/$provider-oauth/plugin.js"
            fixture="plugins/personal-tasks/$provider-oauth/fixtures.json"
            /tmp/aksara-plugin-check plugin lint "$source"
            /tmp/aksara-plugin-check plugin test "$source" --fixture "$fixture"
          done
      - name: Select preinstalled Android NDK
        shell: bash
        run: |
          ndk_root=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$ndk_root"
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
      - name: Build Android ARM64 native binary
        run: sh scripts/build-android.sh
      - name: Prepare installable package
        run: |
          cp deploy/termux/install.sh deploy/termux/.env.example dist/
          cp docs/aksara-termux.md dist/README.md
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md dist/
          cd dist
          sha256sum aksara-ai-router-android-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aksara-ai-router-android-arm64
          path: dist/
          include-hidden-files: true
          retention-days: 30
